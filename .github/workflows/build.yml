name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW-w64 and NSIS
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64 nsis
      - name: Build release
        run: ./build.sh release
      - uses: actions/upload-artifact@v4
        with:
          name: AltDrag-windows
          path: |
            bin/*.exe
            bin/*.dll
            bin/sha256sum.txt
